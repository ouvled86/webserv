# Server 1: Main website
server {
    listen 120.20.20.1:80;
    listen 8080;
    
    # Global server settings
    client_max_body_size 10M;
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # Root location
    location / {
        root /var/www/html;
        index index.html index.htm;
        allow_methods GET POST;
        autoindex off;
    }
    
    # Static files
    location /static {
        root /var/www;
        allow_methods GET;
        autoindex on;
    }
    
    # File uploads
    location /upload {
        root /var/www;
        allow_methods POST DELETE;
        upload_enable on;
        upload_path /var/www/uploads;
        client_max_body_size 50M;
    }
    
    # CGI scripts
    location /cgi-bin {
        root /var/www;
        allow_methods GET POST;
        cgi_extension .php /usr/bin/php-cgi;
        cgi_extension .py /usr/bin/python3;
    }
    
    # Redirect old URL
    location /old-page {
        return 301 /new-page;
    }
}

# Server 2: API server
server {
    listen 3000;
    
    client_max_body_size 5M;
    
    location /api {
        root /var/www/api;
        allow_methods GET POST DELETE;
        index index.html;
    }
}